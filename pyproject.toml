[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktree-run"
version = "0.1.0"
description = "Launch Linear issues in dedicated Git worktrees and tmux windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit>=3.0.48,<4"]
license = "MIT"

[project.scripts]
wtr = "worktree_run.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worktree_run"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
